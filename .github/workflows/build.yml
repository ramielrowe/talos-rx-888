name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # GHCR requires a lowercase path; github.repository preserves owner/repo case.
  CI_IMAGE: ghcr.io/ci-local/talos-rx-888:ci

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Only amd64: the extension carries a static x86-64 binary, and imager
      # extracts the extension image for one --arch at a time.
      - name: Build extension image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: extension
          platforms: linux/amd64
          load: true
          tags: ${{ env.CI_IMAGE }}

      - name: Validate extension layout
        run: python3 hack/validate-extension.py ${{ env.CI_IMAGE }}

      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Push extension image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: extension
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Publishes a Talos installer image with the extension baked in.
  #
  # Tag-gated on purpose: an installer is a large artifact and is only useful at
  # a release boundary, so building one per commit would burn GHCR storage for
  # nothing. An installer is also specific to ONE Talos release and is not
  # forward-compatible, hence the matrix -- add versions as you adopt them.
  installer:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        talos:
          - v1.10.5
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push installer
        env:
          # imager authenticates ghcr.io from this, so the extension package
          # does not need to be public for the pull to succeed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          make push-installer \
            VERSION="$version" \
            TALOS_VERSION="${{ matrix.talos }}"
