name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      talos_version:
        description: >-
          Talos release to build an installer for, e.g. v1.12.11.
          Leave blank to build every supported release.
        required: false
        type: string
      extension_version:
        description: >-
          Extension version to bake in. Must already be published to GHCR
          (a tag build publishes it). Defaults to the tag when run on a tag.
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # GHCR requires a lowercase path; github.repository preserves owner/repo case.
  CI_IMAGE: ghcr.io/ci-local/talos-rx-888:ci

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Only amd64: the extension carries a static x86-64 binary, and imager
      # extracts the extension image for one --arch at a time.
      - name: Build extension image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: extension
          platforms: linux/amd64
          load: true
          tags: ${{ env.CI_IMAGE }}

      - name: Validate extension layout
        run: python3 hack/validate-extension.py ${{ env.CI_IMAGE }}

      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Push extension image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: extension
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Decides which Talos releases to build installers for. A matrix cannot be
  # driven from a workflow input directly, so it is computed here and consumed
  # via fromJSON below.
  plan:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      talos: ${{ steps.matrix.outputs.talos }}
    steps:
      - name: Choose Talos releases
        id: matrix
        run: |
          # The supported Talos releases. Add one here and every future tag
          # build publishes an installer for it.
          default='["v1.10.5", "v1.12.11"]'

          requested='${{ inputs.talos_version }}'
          if [ -n "$requested" ]; then
            printf 'talos=["%s"]\n' "$requested" >> "$GITHUB_OUTPUT"
          else
            printf 'talos=%s\n' "$default" >> "$GITHUB_OUTPUT"
          fi

  # Publishes a Talos installer image with the extension baked in.
  #
  # Runs on tag pushes, and on demand via workflow_dispatch so that a new Talos
  # release can be covered without cutting a new extension release. Building one
  # per commit would burn GHCR storage for nothing.
  #
  # An installer is specific to ONE Talos release and is not forward-compatible,
  # hence the matrix.
  installer:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        talos: ${{ fromJSON(needs.plan.outputs.talos) }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve extension version
        id: ext
        run: |
          set -eu
          version='${{ inputs.extension_version }}'
          if [ -z "$version" ]; then
            case "${GITHUB_REF}" in
              refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
              *)
                echo "::error::extension_version is required when not running on a tag"
                exit 1
                ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building installer for Talos ${{ matrix.talos }} with extension $version"

      - name: Build and push installer
        env:
          # imager authenticates ghcr.io from this, so the extension package
          # does not need to be public for the pull to succeed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make push-installer \
            VERSION="${{ steps.ext.outputs.version }}" \
            TALOS_VERSION="${{ matrix.talos }}"
